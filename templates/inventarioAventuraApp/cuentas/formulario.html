{% extends 'inventarioAventuraApp/base.html' %}
{% block content %}
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">
        {% if usuario_obj %}Editar Usuario: {{ usuario_obj.username }}{% else %}Registrar Nuevo Usuario{% endif %}
    </h1>
    
    <div class="card shadow mb-4 col-md-6">
        <div class="card-body">
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Nombre de usuario</label>
                    <input type="text" name="username" class="form-control" value="{% if usuario_obj %}{{ usuario_obj.username }}{% endif %}" required>
                </div>
                
                <div class="form-group">
                    <label>Correo electronico</label>
                    <input type="email" name="email" class="form-control" value="{% if usuario_obj %}{{ usuario_obj.email }}{% endif %}">
                </div>

                {% if not usuario_obj %}
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                {% endif %}

                <div class="form-group">
                    <label>Rol en el Sistema</label>
                    <select name="rol" class="form-control">
                        <option value="Administrador" {% if perfil.rol == 'Administrador' %}selected{% endif %}>Administrador</option>
                        <option value="Guia" {% if perfil.rol == 'Guia' %}selected{% endif %}>Guia / Operador</option>
                        <option value="Turista" {% if perfil.rol == 'Turista' %}selected{% endif %}>Turista / Cliente</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    {% if usuario_obj %}Guardar Cambios{% else %}Registrar Usuario{% endif %}
                </button>
                <a href="{% url 'listar_usuarios' %}" class="btn btn-secondary">Volver</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
